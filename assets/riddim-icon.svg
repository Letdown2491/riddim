<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Riddim music player">
  <title>Riddim music player</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#6f5cff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ac0"/>
      <stop offset="1" stop-color="#7fa2ff"/>
    </linearGradient>
  </defs>

  <!-- record -->
  <circle cx="256" cy="256" r="240" fill="#15112e"/>

  <!-- grooves -->
  <g fill="none" stroke="#2b2358" stroke-width="3">
    <circle cx="256" cy="256" r="222"/>
    <circle cx="256" cy="256" r="198"/>
    <circle cx="256" cy="256" r="174"/>
    <circle cx="256" cy="256" r="150"/>
    <circle cx="256" cy="256" r="126"/>
  </g>

  <!-- light catching the vinyl -->
  <g fill="none" stroke="url(#sheen)" stroke-width="14" stroke-linecap="round">
    <path d="M68.1 187.6 A200 200 0 0 1 187.6 68.1"/>
    <path d="M443.9 324.4 A200 200 0 0 1 324.4 443.9"/>
  </g>

  <!-- label -->
  <circle cx="256" cy="256" r="94" fill="url(#accent)"/>
  <circle cx="256" cy="256" r="94" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>

  <!-- play -->
  <path d="M238 214 V298 L306 256 Z" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
</svg>
