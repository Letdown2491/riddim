[package]
name = "riddim"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1.0"
async-channel = "2.5"
base64 = "0.22"
cpal = "0.18"
directories = "6.0"
env_logger = "0.11"
futures = "0.3"
gpui-kit = "0.7.0"
# keyring's default `v1` mode covers macOS Keychain, the Windows credential
# store, and the Linux Secret Service (zbus) in one dependency.
keyring = "4.1"
librespot = { version = "0.8.0", default-features = false, features = ["native-tls"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
souvlaki = { version = "0.8.3", default-features = false }
[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "native-tls"] }
oauth2-reqwest = { package = "reqwest", version = "0.12", default-features = false, features = ["native-tls"] }
open = "5.3"
rspotify = { version = "0.16.0", default-features = false, features = ["client-reqwest", "reqwest-native-tls"] }
# gpui-kit's HTTP client is built on this reqwest fork; sharing it keeps one build.
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls", "stream"] }
ringbuf = "0.5"
rubato = "5"
# debug-embed embeds assets even in debug builds: rust-embed otherwise loads
# from the filesystem at the compile-time path, which breaks when the binary
# is built inside the container but run on the host (and unification applies
# the feature to gpui-kit-assets' own embedded icon catalog too).
rust-embed = { version = "8", features = ["debug-embed"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5"
log = "0.4.33"

[build-dependencies]
# librespot 0.8's build script is incompatible with vergen 9.1.
vergen = "=9.0.6"

[dev-dependencies]
gpui-kit = { version = "0.7.0", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[test]]
name = "ui_rendering"
path = "src/ui_rendering.rs"
harness = false
test = false

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
